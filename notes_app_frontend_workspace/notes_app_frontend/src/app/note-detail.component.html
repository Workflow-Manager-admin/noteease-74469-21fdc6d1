<div class="note-detail" *ngIf="note">
  <header class="detail-header">
    <button *ngIf="!editMode" class="edit-btn" (click)="startEdit()" title="Edit note" aria-label="Edit">📝 Edit</button>
    <button class="delete-btn" (click)="onDelete()" title="Delete note" aria-label="Delete">🗑 Delete</button>
  </header>
  <ng-container *ngIf="editMode; else readonly">
    <form (ngSubmit)="onSave()" autocomplete="off">
      <input class="input-title"
             type="text"
             maxlength="100"
             [(ngModel)]="editNote!.title"
             name="title"
             required
             placeholder="Title">
      <textarea class="input-content"
                [(ngModel)]="editNote!.content"
                name="content"
                rows="10"
                required
                placeholder="Your note..."></textarea>
      <div class="actions">
        <button type="submit" class="save-btn">Save</button>
        <button type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </ng-container>
  <ng-template #readonly>
    <h2 class="note-title">{{ note.title || '(Untitled)' }}</h2>
    <div class="note-dates">
      <span>Edited: {{ note.updatedAt | date:'medium' }}</span>
    </div>
    <div class="note-content">{{ note.content || 'No content' }}</div>
  </ng-template>
</div>
