<aside class="sidebar">
  <div class="sidebar-header">
    <h2>Notes</h2>
    <button class="add-btn"
      (click)="createNote.emit()"
      title="Create new note"
      aria-label="Add note">
      <span>＋</span>
    </button>
  </div>
  <ul class="notes-list" *ngIf="notes.length > 0; else empty">
    <li *ngFor="let note of notes; trackBy: trackById"
        [class.selected]="note.id === selectedNoteId"
        (click)="selectNote.emit(note.id)">
      <div class="note-title">{{ note.title || '(Untitled)' }}</div>
      <div class="note-preview">{{ note.content | slice:0:42 }}</div>
      <div class="note-date">{{ note.updatedAt | date:'short' }}</div>
    </li>
  </ul>
  <ng-template #empty>
    <div class="no-notes">No notes yet. Tap ＋ to add!</div>
  </ng-template>
</aside>
